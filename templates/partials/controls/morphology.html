<div class="space-y-2">
    <div>
        <label class="text-[11px] text-surface-600 dark:text-surface-400 flex justify-between"><span>Kernel</span><span class="text-surface-800 dark:text-surface-300 font-mono" id="morphVal">5</span></label>
        <input type="range" name="kernel" min="3" max="10" value="5" class="w-full"
               oninput="document.getElementById('morphVal').textContent=this.value">
    </div>
    <div class="grid grid-cols-2 gap-1.5">
        <button class="text-xs bg-surface-50 dark:bg-surface-800 hover:bg-surface-200 dark:bg-surface-700 text-surface-800 dark:text-surface-300 py-1.5 px-2 rounded-lg transition-all"
                hx-post="/api/apply"
                hx-vals='{"operation": "erosion"}'
                hx-include="[name='kernel']"
                hx-target="#editor-content"
                hx-swap="innerHTML">Erode</button>
        <button class="text-xs bg-surface-50 dark:bg-surface-800 hover:bg-surface-200 dark:bg-surface-700 text-surface-800 dark:text-surface-300 py-1.5 px-2 rounded-lg transition-all"
                hx-post="/api/apply"
                hx-vals='{"operation": "dilation"}'
                hx-include="[name='kernel']"
                hx-target="#editor-content"
                hx-swap="innerHTML">Dilate</button>
        <button class="text-xs bg-surface-50 dark:bg-surface-800 hover:bg-surface-200 dark:bg-surface-700 text-surface-800 dark:text-surface-300 py-1.5 px-2 rounded-lg transition-all"
                hx-post="/api/apply"
                hx-vals='{"operation": "opening"}'
                hx-include="[name='kernel']"
                hx-target="#editor-content"
                hx-swap="innerHTML">Open</button>
        <button class="text-xs bg-surface-50 dark:bg-surface-800 hover:bg-surface-200 dark:bg-surface-700 text-surface-800 dark:text-surface-300 py-1.5 px-2 rounded-lg transition-all"
                hx-post="/api/apply"
                hx-vals='{"operation": "closing"}'
                hx-include="[name='kernel']"
                hx-target="#editor-content"
                hx-swap="innerHTML">Close</button>
    </div>
</div>
