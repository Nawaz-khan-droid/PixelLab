<div class="space-y-3">
    <!-- Gaussian Noise -->
    <div class="bg-surface-50 dark:bg-surface-800/30 rounded-lg p-2">
        <div class="flex items-center justify-between mb-1">
            <span class="text-[11px] font-medium text-surface-800 dark:text-surface-300">Gaussian Noise</span>
            <span class="text-[10px] text-surface-500 font-mono" id="noiseSigmaVal">25</span>
        </div>
        <input type="range" name="sigma" min="1" max="100" value="25" class="w-full"
               id="sigma_noise"
               oninput="document.getElementById('noiseSigmaVal').textContent=this.value">
        <button class="w-full text-[11px] bg-brand-600 hover:bg-brand-500 text-white py-1.5 px-3 rounded-lg transition-all mt-1.5 flex items-center justify-center gap-1"
                hx-post="/api/apply"
                hx-vals='{"operation": "gaussian_noise"}'
                hx-include="#sigma_noise"
                hx-target="#editor-content"
                hx-swap="innerHTML">
            Apply Gaussian <span class="htmx-indicator"></span>
        </button>
    </div>
    <!-- Salt & Pepper -->
    <div class="bg-surface-50 dark:bg-surface-800/30 rounded-lg p-2">
        <div class="flex items-center justify-between mb-1">
            <span class="text-[11px] font-medium text-surface-800 dark:text-surface-300">Salt &amp; Pepper</span>
            <span class="text-[10px] text-surface-500 font-mono" id="spAmountVal">0.02</span>
        </div>
        <input type="range" name="amount" min="0.01" max="0.10" step="0.01" value="0.02" class="w-full"
               id="amount_salt_pepper"
               oninput="document.getElementById('spAmountVal').textContent=parseFloat(this.value).toFixed(2)">
        <button class="w-full text-[11px] bg-surface-200 dark:bg-surface-700 hover:bg-surface-600 text-surface-800 dark:text-surface-300 py-1.5 px-3 rounded-lg transition-all mt-1.5 flex items-center justify-center gap-1"
                hx-post="/api/apply"
                hx-vals='{"operation": "salt_pepper"}'
                hx-include="#amount_salt_pepper"
                hx-target="#editor-content"
                hx-swap="innerHTML">
            Apply S&amp;P <span class="htmx-indicator"></span>
        </button>
    </div>
</div>
