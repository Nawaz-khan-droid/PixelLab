<div class="space-y-2">
    <div>
        <label class="text-[11px] text-surface-600 dark:text-surface-400 flex justify-between"><span>Brightness</span><span class="text-surface-800 dark:text-surface-300 font-mono" id="brightVal">0</span></label>
        <input type="range" name="brightness" min="-100" max="100" value="0" class="w-full"
               oninput="document.getElementById('brightVal').textContent=this.value">
    </div>
    <div>
        <label class="text-[11px] text-surface-600 dark:text-surface-400 flex justify-between"><span>Contrast</span><span class="text-surface-800 dark:text-surface-300 font-mono" id="contrastVal">1.0</span></label>
        <input type="range" name="contrast" min="0.5" max="2.0" step="0.1" value="1.0" class="w-full"
               oninput="document.getElementById('contrastVal').textContent=parseFloat(this.value).toFixed(1)">
    </div>
    <button class="w-full text-xs bg-brand-600 hover:bg-brand-500 text-white py-1.5 px-3 rounded-lg transition-all flex items-center justify-center gap-1"
            hx-post="/api/apply"
            hx-vals='{"operation": "brightness_contrast"}'
            hx-include="[name='brightness'], [name='contrast']"
            hx-target="#editor-content"
            hx-swap="innerHTML">
        Apply <span class="htmx-indicator"></span>
    </button>
</div>
