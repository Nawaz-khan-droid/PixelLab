<div class="space-y-2">
    <div>
        <label class="text-[11px] text-surface-600 dark:text-surface-400 flex justify-between"><span>Hue Shift</span><span class="text-surface-800 dark:text-surface-300 font-mono" id="hueVal">0</span></label>
        <input type="range" name="hue_shift" min="-30" max="30" value="0" class="w-full"
               oninput="document.getElementById('hueVal').textContent=this.value">
    </div>
    <div>
        <label class="text-[11px] text-surface-600 dark:text-surface-400 flex justify-between"><span>Saturation</span><span class="text-surface-800 dark:text-surface-300 font-mono" id="satVal">1.0</span></label>
        <input type="range" name="sat_factor" min="0.0" max="2.0" step="0.1" value="1.0" class="w-full"
               oninput="document.getElementById('satVal').textContent=parseFloat(this.value).toFixed(1)">
    </div>
    <button class="w-full text-xs bg-brand-600 hover:bg-brand-500 text-white py-1.5 px-3 rounded-lg transition-all flex items-center justify-center gap-1"
            hx-post="/api/apply"
            hx-vals='{"operation": "hue_saturation"}'
            hx-include="[name='hue_shift'], [name='sat_factor']"
            hx-target="#editor-content"
            hx-swap="innerHTML">
        Apply <span class="htmx-indicator"></span>
    </button>
</div>
