<div class="space-y-2">
    <div>
        <label class="text-[11px] text-surface-600 dark:text-surface-400 flex justify-between"><span>Factor</span><span class="text-surface-800 dark:text-surface-300 font-mono" id="hbFactorVal">2.0</span></label>
        <input type="range" name="factor" min="1.5" max="5.0" step="0.1" value="2.0" class="w-full"
               oninput="document.getElementById('hbFactorVal').textContent=parseFloat(this.value).toFixed(1)">
    </div>
    <button class="w-full text-xs bg-brand-600 hover:bg-brand-500 text-white py-1.5 px-3 rounded-lg transition-all flex items-center justify-center gap-1"
            hx-post="/api/apply"
            hx-vals='{"operation": "high_boost"}'
            hx-include="[name='factor']"
            hx-target="#editor-content"
            hx-swap="innerHTML">
        Apply <span class="htmx-indicator"></span>
    </button>
</div>
