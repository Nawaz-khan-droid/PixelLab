<div class="space-y-2">
    <div>
        <label class="text-[11px] text-surface-600 dark:text-surface-400 flex justify-between"><span>Red</span><span class="text-surface-800 dark:text-surface-300 font-mono" id="rVal">1.0</span></label>
        <input type="range" name="r" min="0.0" max="2.0" step="0.1" value="1.0" class="w-full"
               oninput="document.getElementById('rVal').textContent=parseFloat(this.value).toFixed(1)">
    </div>
    <div>
        <label class="text-[11px] text-surface-600 dark:text-surface-400 flex justify-between"><span>Green</span><span class="text-surface-800 dark:text-surface-300 font-mono" id="gVal">1.0</span></label>
        <input type="range" name="g" min="0.0" max="2.0" step="0.1" value="1.0" class="w-full"
               oninput="document.getElementById('gVal').textContent=parseFloat(this.value).toFixed(1)">
    </div>
    <div>
        <label class="text-[11px] text-surface-600 dark:text-surface-400 flex justify-between"><span>Blue</span><span class="text-surface-800 dark:text-surface-300 font-mono" id="bVal">1.0</span></label>
        <input type="range" name="b" min="0.0" max="2.0" step="0.1" value="1.0" class="w-full"
               oninput="document.getElementById('bVal').textContent=parseFloat(this.value).toFixed(1)">
    </div>
    <button class="w-full text-xs bg-brand-600 hover:bg-brand-500 text-white py-1.5 px-3 rounded-lg transition-all flex items-center justify-center gap-1"
            hx-post="/api/apply"
            hx-vals='{"operation": "color_balance"}'
            hx-include="[name='r'], [name='g'], [name='b']"
            hx-target="#editor-content"
            hx-swap="innerHTML">
        Apply <span class="htmx-indicator"></span>
    </button>
</div>
