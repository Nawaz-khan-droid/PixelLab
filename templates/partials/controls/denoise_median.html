<div class="space-y-2">
    <div>
        <label class="text-[11px] text-surface-600 dark:text-surface-400 flex justify-between"><span>Kernel</span><span class="text-surface-800 dark:text-surface-300 font-mono" id="dmKernelVal">5</span></label>
        <input type="range" name="kernel" min="3" max="101" step="2" value="5" class="w-full"
               oninput="document.getElementById('dmKernelVal').textContent=this.value">
    </div>
    <button class="w-full text-xs bg-brand-600 hover:bg-brand-500 text-white py-1.5 px-3 rounded-lg transition-all flex items-center justify-center gap-1"
            hx-post="/api/apply"
            hx-vals='{"operation": "denoise_median"}'
            hx-include="[name='kernel']"
            hx-target="#editor-content"
            hx-swap="innerHTML">
        Apply <span class="htmx-indicator"></span>
    </button>
</div>
