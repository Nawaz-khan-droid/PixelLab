<div class="space-y-2">
    <div>
        <label class="text-[11px] text-surface-600 dark:text-surface-400 flex justify-between"><span>Angle</span><span class="text-surface-800 dark:text-surface-300 font-mono" id="rotateAngleVal">0</span></label>
        <input type="range" name="angle" min="0" max="360" value="0" class="w-full"
               oninput="document.getElementById('rotateAngleVal').textContent=this.value">
    </div>
    <button class="w-full text-xs bg-brand-600 hover:bg-brand-500 text-white py-1.5 px-3 rounded-lg transition-all flex items-center justify-center gap-1"
            hx-post="/api/apply"
            hx-vals='{"operation": "rotate"}'
            hx-include="[name='angle']"
            hx-target="#editor-content"
            hx-swap="innerHTML">
        Apply <span class="htmx-indicator"></span>
    </button>
</div>
