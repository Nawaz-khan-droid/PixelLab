{% extends "base.html" %}
{% block title %}PixelLab - Download{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-56px)] p-4">
    {% if has_image %}
    <div class="text-center space-y-4">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-surface-50 dark:bg-surface-800/50 border border-surface-200 dark:border-surface-700/50 flex items-center justify-center">
            <svg class="w-8 h-8 text-surface-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        </div>
        <div>
            <h3 class="text-surface-800 dark:text-surface-300 font-medium">Download your image</h3>
            <p class="text-surface-500 text-sm mt-1">Click below to save as PNG</p>
        </div>
        <a href="/download" class="inline-block bg-brand-600 hover:bg-brand-500 text-white px-6 py-2.5 rounded-xl text-sm font-medium transition-all">Download PNG</a>
    </div>
    {% else %}
    <div class="text-center space-y-4">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-surface-50 dark:bg-surface-800/50 border border-surface-200 dark:border-surface-700/50 flex items-center justify-center">
            <svg class="w-8 h-8 text-surface-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        </div>
        <div>
            <h3 class="text-surface-800 dark:text-surface-300 font-medium">No image to download</h3>
            <p class="text-surface-500 text-sm mt-1">Upload and edit an image first</p>
        </div>
        <a href="/editor" class="inline-block bg-brand-600 hover:bg-brand-500 text-white px-6 py-2.5 rounded-xl text-sm font-medium transition-all">Go to Editor</a>
    </div>
    {% endif %}
</div>
{% endblock %}
